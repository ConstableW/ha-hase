id: middle_earth
name:
  en: Middle-earth
commands:
- id: light_of_earendil
  trigger:
    de: licht von eärendil {area}
    en: light of eärendil {area}
  operation: light.set_power
  target:
    kind: area_name
    capture: area
  arguments:
    'on': true
  catchphrase:
    en: Ein Licht an dunklen Orten.
  output:
    de: Licht {area} einschalten
    en: Turn on the light in {area}
- id: light_beacons_named_area
  trigger:
    de: entzündet die leuchtfeuer von {area}
    en: light the beacons of {area}
  operation: light.set_power
  target:
    kind: area_name
    capture: area
  arguments:
    'on': true
  catchphrase:
    en: Rohan wird antworten.
  output:
    de: Licht {area} auf 100 Prozent stellen
    en: Set the light in {area} to 100 percent
- id: light_beacons_default_area
  trigger:
    de: entzündet die leuchtfeuer
    en: light the beacons
  operation: light.set_power
  target:
    kind: source_area
  arguments:
    'on': true
  catchphrase:
    en: Ein Licht in der Nähe.
- id: extinguish_fires
  trigger:
    de: löscht die feuer von {area}
    en: extinguish the fires of {area}
  operation: light.set_power
  target:
    kind: area_name
    capture: area
  arguments:
    'on': false
  catchphrase:
    en: Die Feuer sind erloschen.
  output:
    de: Licht {area} ausschalten
    en: Turn off the light in {area}
- id: extinguish_beacons
  trigger:
    de: löscht die leuchtfeuer von {area}
    en: extinguish the beacons of {area}
