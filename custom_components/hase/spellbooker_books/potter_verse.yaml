# Potterverse - spellbooker_books version of the legacy
# spellbooks/potter_verse.yaml. Only the subset that maps onto today's
# typed operation catalog (light.set_power, media_player.skip_track) is
# here - lumos maxima/minima (brightness), colovaria (color), the
# device/cover/lock/alarm/climate/scene spells and every Assist-only
# query stay exclusively in the legacy book for now; those need new
# catalog operations first (see conversation notes 2026-09-10).

id: potter_verse
name: "Potterverse"

commands:
  - id: lumos
    trigger: "lumos {area}"
    operation: light.set_power
    target:
      kind: area_name
      capture: area
    arguments:
      "on": true
    catchphrase: "Lumos."

  - id: nox
    trigger: "nox {area}"
    operation: light.set_power
    target:
      kind: area_name
      capture: area
    arguments:
      "on": false
    catchphrase: "Nox."

  - id: lumos_maxima_all
    trigger: "lumos maxima"
    operation: light.set_power
    target:
      kind: all_allowed
    arguments:
      "on": true
    catchphrase: "Lumos Maxima."

  - id: nox_maxima_all
    trigger: "nox maxima"
    operation: light.set_power
    target:
      kind: all_allowed
    arguments:
      "on": false
    catchphrase: "Nox Maxima."

  - id: diffindo
    trigger: "diffindo {area}"
    operation: media_player.skip_track
    target:
      kind: area_name
      capture: area
    arguments:
      forward: true
    catchphrase: "Diffindo."

  - id: reparifarge
    trigger: "reparifarge {area}"
    operation: media_player.skip_track
    target:
      kind: area_name
      capture: area
    arguments:
      forward: false
    catchphrase: "Reparifarge."
