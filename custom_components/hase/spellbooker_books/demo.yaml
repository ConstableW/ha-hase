# Etappe 2/3/4 demo spellbook: proves the full Spellbooker pipeline
# (Adapter -> Router -> Engine -> Executor -> HA) with the v1 catalog
# (see docs/spellbook-engine/stage-1/README.md), a deliberately
# confusable pair (aktiviere/deaktiviere) for the Etappe 3
# clarification flow, and all_allowed + vacuum.clean_area for Etappe
# 4. Not a replacement for the existing custom_components/hase/providers/code27/
# spellbooks/*.yaml - those stay on the legacy bridge.py path; Etappe
# 4 only proved they *can* be migrated (core/legacy_migration.py),
# not that they have been cut over live yet.
id: spellbooker_demo
name: Spellbooker Demo

commands:
  - id: light_on
    trigger: "licht {area} an"
    operation: light.set_power
    target:
      kind: area_name
      capture: area
    arguments:
      "on": true
    catchphrase: "Mach ich."

  - id: light_off
    trigger: "licht {area} aus"
    operation: light.set_power
    target:
      kind: area_name
      capture: area
    arguments:
      "on": false
    catchphrase: "Erledigt."

  - id: get_state
    trigger: "wie ist der zustand von {entity}"
    operation: entity.get_state
    target:
      kind: entity_name
      capture: entity

  # Deliberately confusable pair - "deaktiviere" fuzzy-contains
  # "aktiviere", so a garbled utterance genuinely sits close to both.
  # Exists to exercise the Etappe 3 clarification flow, not as a
  # recommended everyday trigger pair.
  - id: activate
    trigger: "aktiviere licht {area}"
    operation: light.set_power
    target:
      kind: area_name
      capture: area
    arguments:
      "on": true
    catchphrase: "Aktiviert."

  - id: deactivate
    trigger: "deaktiviere licht {area}"
    operation: light.set_power
    target:
      kind: area_name
      capture: area
    arguments:
      "on": false
    catchphrase: "Deaktiviert."

  - id: lights_all_on
    trigger: "alle lichter an"
    operation: light.set_power
    target:
      kind: all_allowed
    arguments:
      "on": true
    catchphrase: "Ganz Zwergstadt erstrahlt."

  - id: lights_all_off
    trigger: "alle lichter aus"
    operation: light.set_power
    target:
      kind: all_allowed
    arguments:
      "on": false
    catchphrase: "Alles dunkel."

  - id: clean_room
    trigger: "reinige {area}"
    operation: vacuum.clean_area
    target:
      kind: area_name
      capture: area
    catchphrase: "Wird gereinigt."

  - id: next_track
    trigger: "naechster titel"
    operation: media_player.skip_track
    target:
      kind: all_allowed
    arguments:
      forward: true
    catchphrase: "Naechster Titel."

  - id: previous_track
    trigger: "voriger titel"
    operation: media_player.skip_track
    target:
      kind: all_allowed
    arguments:
      forward: false
    catchphrase: "Voriger Titel."
