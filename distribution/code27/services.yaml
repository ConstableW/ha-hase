create_alarm:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: code27
    hour:
      required: true
      selector:
        number:
          min: 0
          max: 23
          mode: box
    minute:
      required: true
      selector:
        number:
          min: 0
          max: 59
          mode: box
    label:
      selector:
        text:
    days:
      selector:
        select:
          multiple: true
          options:
            - "mon"
            - "tue"
            - "wed"
            - "thu"
            - "fri"
            - "sat"
            - "sun"
    enabled:
      selector:
        boolean:

