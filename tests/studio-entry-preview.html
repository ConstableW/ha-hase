<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HASE integration toolbar fixture</title>
<style>body{background:#111;color:#eee;font:15px system-ui;padding:32px}button{font:inherit;padding:8px 16px}label{display:block;margin-bottom:24px}</style>
<label><input id="hub" type="checkbox"> Include a CODE27 hub</label>
<ha-config-integration-page></ha-config-integration-page>
<script type="module">
class IntegrationFixture extends HTMLElement {
  constructor(){super();this.domain="hase";this.attachShadow({mode:"open"});this.render(false);}
  render(hub){this.shadowRoot.innerHTML=`<style>.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button{background:#007d9b;color:white;border:0;border-radius:20px;padding:10px 16px;font:inherit}section{border:1px solid #444;padding:24px;margin-top:24px}</style><h1>HASE – Home Assistant Spellbook Engine</h1><div class="actions"><button>Add hub</button>${hub?"<button>+ Add satellite</button>":""}</div>${hub?"<section>CODE27 (hub)</section>":""}<section>Standalone Spellbooker</section>`;}
}
customElements.define("ha-config-integration-page",IntegrationFixture);
document.querySelector("#hub").addEventListener("change",event=>document.querySelector("ha-config-integration-page").render(event.target.checked));
await import("/custom_components/hase/frontend/assist-entry.js?v=locale-fix2");
</script></html>
