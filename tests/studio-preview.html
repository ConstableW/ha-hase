<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HASE Studio – lokale UI-Prüfung</title><style>body{margin:0}hase-spellbook-studio{height:calc(100vh - 42px)}.test-controls{height:42px;background:#102331;color:white;display:flex;align-items:center;gap:12px;padding:0 18px;font:14px system-ui}</style><div class="test-controls"><label>Test locale <select id="test-locale"><option value="de">Deutsch</option><option value="en">English</option><option value="fr">Français (fallback)</option></select></label></div><hase-spellbook-studio></hase-spellbook-studio><script type="module">
import '../custom_components/hase/frontend/studio.js?v=books-pass3';
const spell={id:'lumos',name:'Lumos',trigger:'Lumos',operation:'light.set_power',arguments:{on:true},target:{kind:'area_id',value:'living'},tags:['Lichtmagie']};
const books=[{id:'potter_verse',name:'Potterverse',description:'Magische Worte für dein Zuhause.',commands:[spell,{...spell,id:'nox',name:'Nox',trigger:'Nox',arguments:{on:false}},{...spell,id:'party',name:'Fest in Hogwarts',trigger:'Party',expert:{target:{kind:'template',value:"{{ ['light.ceiling'] }}"},operation:'light.set_power',arguments:{on:true}}}]},{id:'middle_earth',name:'Herr der Ringe',commands:[]},{id:'cc',name:'Command & Conquer',commands:[]}];
for(const b of books){b.default_language='de';b.languages=['de','en'];} books[0].name={de:'Potterverse',en:'Potterverse'};books[0].commands[0].trigger={de:'Lumos',en:'Illuminate'};books[0].commands[0].name={de:'Lichtzauber',en:'Light spell'};
const overrides=new Set();
const actions=[{id:'light.set_power:0',label:'Licht einschalten',operation:'light.set_power',arguments:{on:true},targets:['area_name','area_id','entity_ids','entity_id','all_allowed','source_area']},{id:'light.set_power:1',label:'Licht ausschalten',operation:'light.set_power',arguments:{on:false},targets:['area_name','area_id','entity_ids','entity_id','all_allowed','source_area']}];
const registry={areas:[{id:'living',name:'Wohnzimmer'},{id:'kitchen',name:'Küche'}],entities:[{id:'light.ceiling',name:'Deckenlicht',area_id:'living',domain:'light',state:'off'},{id:'light.floor',name:'Stehlampe',area_id:'living',domain:'light',state:'off'}],devices:[]};
document.querySelector('hase-spellbook-studio').panel={config:{brand_url:'../custom_components/hase/brand/icon.png'}};
document.querySelector('hase-spellbook-studio').hass={locale:{language:'de'},callWS:async ({operation,data})=>{
  const book=books.find(b=>b.id===data.book_id);
  if(operation==='list')return {books:books.map(b=>({...b,count:b.commands.length,origin:overrides.has(b.id)?'override':'builtin',capability:b.id==='potter_verse'?'USER + EXPERT':'USER',expert_allowed:false})),actions,operations:['light.set_power']};
  if(operation==='ui_settings')return {show_in_sidebar:data.show_in_sidebar};
  if(operation==='registry')return registry;
  if(operation==='read')return {book:structuredClone(book),revision:'preview',default_language:book.default_language,languages:book.languages,origin:overrides.has(book.id)?'override':'builtin',can_reset:overrides.has(book.id),can_delete:overrides.has(book.id),expert_allowed:false,capability:'USER + EXPERT',spell_capabilities:Object.fromEntries(book.commands.map(c=>[c.id,c.expert?'USER + EXPERT':'USER'])),profiles:[{id:'voice',name:'Wohnzimmer-Assistent'}]};
  if(operation==='manage_language'){if(data.action==='add'){book.languages.push(data.code);for(const obj of [book,...book.commands])for(const key of ['name','trigger','description','triggers','examples','output','catchphrase'])if(obj[key]){if(typeof obj[key]==='string'||Array.isArray(obj[key]))obj[key]={[book.default_language]:obj[key]};if(data.source&&obj[key][data.source])obj[key][data.code]=structuredClone(obj[key][data.source]);}}if(data.action==='default')book.default_language=data.code;if(data.action==='remove'){book.languages=book.languages.filter(code=>code!==data.code);for(const obj of [book,...book.commands])for(const key of ['name','trigger','description','triggers','examples','output','catchphrase'])if(obj[key]&&typeof obj[key]==='object')delete obj[key][data.code];}overrides.add(book.id);return {};}
  if(operation==='dry_run')return {status:'SUCCESS',reason_code:'dry_run',data:{entity_ids:['light.ceiling','light.floor'],raw:['light.ceiling','light.floor'],targets:[{entity_id:'light.ceiling',reason:'allowed'}]}};
  throw new Error('Lokale UI-Prüfung: Diese Aktion ist im Test nicht angeschlossen.');
}};
document.querySelector('#test-locale').addEventListener('change',event=>{const studio=document.querySelector('hase-spellbook-studio');studio.hass={...studio.hass,locale:{language:event.target.value}};});
</script></html>
