      cases: ["BridgeSafety.test_tts_uses_expected_slot_voice_when_still_active (state mock returns ENDED immediately)"]
    quirks: "Only the ENDED path is exercised by tests; the FAILED path and the 15s timeout path are untested. A missed poll is logged at debug and does not abort the wait. The 15s deadline matches the device web UI's own audition timeout, so very long utterances can report tts_timeout while playback continues."
    notes: "This polling is what makes hase.speak semantically correct: the POST acknowledgement is never treated as playback completion."

