# HASE x CODE27 - Machine-readable implementation ledger
#
# Purpose
#   Canonical, mechanically checkable record of which CODE27 local-API
#   operations the CURRENT HASE CODE27 provider implements, and how.
#   Companion document: docs/code27/implemented-api.md (same operation set).
#
# Source of truth
#   CODE27 side : "C:\USERDATA\HA-Code27 API\_recon\inventory.json"
#                 (127 method+path entries) plus CODE27-LOCAL-API.md,
#                 code27-endpoints.md, code27-runtime-architecture-findings.md,
#                 code27-local-data-hase-audit.md, code27-ota-acquisition-findings.md
#   HASE side   : the actual current code under
#                 custom_components/hase/providers/code27/
#
# Audit scope note
#   This ledger was produced by static inspection only. No CODE27 device was
#   contacted, no endpoint was called and no live test was executed while
#   producing it. Every HASE-side statement below is therefore
#   VERIFIED_FROM_CODE. Where the HASE source itself asserts that a behaviour
#   was previously confirmed against real hardware, that claim is recorded in
#   `quirks` and is NOT re-verified here.
#
# ID stability contract
#   `id` is a stable C27-NNN identifier, assigned once in alphabetical order of
#   (method, path) where path placeholders such as {id} / {slot} are removed for
#   sorting purposes only. IDs are never renumbered and never reused. A future
#   endpoint appended to the authoritative inventory gets the next free ID at the
#   end of the list. An endpoint that disappears upstream keeps its entry and its
#   ID and is marked REMOVED_UPSTREAM.
#
#   History: the previous revision of this ledger (2026-09-23) carried
#   C27-127 = "PUT /v1/ws/channel". That was an error: /v1/ws/channel is the
#   WebSocket channel, it is not one of the 127 REST operations, and the real
#   inventory operation "PUT /data/user/slot" was missing. C27-127 now names
#   PUT /data/user/slot. IDs C27-001..C27-126 are unchanged from that revision.
#   The WebSocket endpoint is documented in the `websocket` section below, not as
#   a REST operation.
#
# Status vocabulary (exactly one per operation)
#   IMPLEMENTED               - a real current runtime path calls it and the
#                               semantics needed for correct use are covered.
#   PARTIAL                   - called, but part of a documented asynchronous or
#                               multi-stage contract is not handled.
#   NOT_IMPLEMENTED           - no current runtime path (absent, dead code only,
#                               or test-only).
#   INTENTIONALLY_UNSUPPORTED - HASE deliberately does not call it and the
#                               stated reason is supported by CODE27 evidence.
#   CAPABILITY_GATED          - CODE27 gates it behind a device capability that is
#                               disabled on the known device, so HASE cannot use
#                               it. This is a CODE27 constraint, not a HASE bug.
#   NOT_RELEVANT_TO_HASE      - not meaningful for a Home Assistant integration.
#   REMOVED_UPSTREAM          - historical entry, endpoint no longer offered.
#
# Verification vocabulary
#   VERIFIED_LIVE       - confirmed against a real device (research evidence)
#   VERIFIED_FROM_CODE  - confirmed by reading current source, not executed
#   NOT_LIVE_TESTED     - route/behaviour known from the bundle, never executed
#   BLOCKED             - cannot be established from available evidence
#
# Change control
#   When CODE27 changes: update the authoritative analysis, add a NEW C27 ID per
#   new operation, never renumber, then update this file, implemented-api.md and
#   the HASE implementation + tests together, and re-run the conformance check
#   described in implemented-api.md.
#
# TRACKING WARNING
#   This file is currently GIT-IGNORED. .gitignore line 16 is "/docs/*" with
#   allowlists for de/, en/, branding/, screenshots/ and examples/ but none for
#   code27/, so "git check-ignore -v docs/code27/implemented-api.yaml" matches
#   .gitignore:16. Until "!/docs/code27/" and "!/docs/code27/**" are added, this
#   ledger and its Markdown companion cannot be committed, will not appear in a
#   clone, and cannot be consumed by CI - defeating their purpose. The provider
#   directory custom_components/hase/providers/code27/ is likewise ignored as
#   "Private / vendor-specific providers".

meta:
  ledger_version: 2
  generated: "2026-09-23"
  source_inventory: "_recon/inventory.json"
  source_inventory_count: 127
  ledger_operation_count: 127
  ordering_rule: "alphabetical by (method, path-with-placeholders-removed)"
  id_range: "C27-001..C27-127"

  counts:
    total_code27_operations: 127
    implemented: 51
    partial: 0
    not_implemented: 54
    intentionally_unsupported: 1
    capability_gated: 21
    not_relevant_to_hase: 0
    removed_upstream: 0

  implemented_test_coverage:
    strong: 14
    partial: 24
    none: 13

  implemented_direction:
    read_operations_implemented: 24
    write_operations_implemented: 27

  # Deliberately NOT computed: a generic "percent complete". Not every CODE27
  # endpoint belongs in a Home Assistant integration, so such a figure would
  # mislead. Only the per-status counts above are meaningful.

  boundary_notes:
    - "No percentage-complete figure is published; see counts above."
    - "CAPABILITY_GATED counts are CODE27 server-side constraints evidenced by
       GET /data/user/system -> capabilities, not HASE defects."
    - "All HASE-side values in this file are static-analysis results."

# ---------------------------------------------------------------------------
# WebSocket channel (NOT part of the 127 REST operations)
# ---------------------------------------------------------------------------
websocket:
  endpoint: "ws://<host>:8081/v1/ws/channel"
  code27_evidence: "code27-endpoints.md (signed handshake, 401 unsigned); CODE27-LOCAL-API.md section 6.4"
  code27_verification: VERIFIED_LIVE
  auth:
    scheme: "HMAC-SHA256 in query parameters (a browser cannot set WS headers)"
    string_to_sign: "GET|/v1/ws/channel|<timestamp>|<nonce>|empty|<sha256(\"\")>|<user_id>"
    query_parameters: ["sig", "nonce", "timestamp", "payload_mode", "body_hash", "user_id"]
    optional_query_parameters: ["session_id"]
    session_id_required_when: "the paired credential has auth_scope=session"
  hase_verification: VERIFIED_FROM_CODE
  hase_implementation:
    file: "custom_components/hase/providers/code27/websocket_client.py"
    symbol: "Code27WebSocket"
    url_builder_file: "custom_components/hase/providers/code27/api.py"
    url_builder_symbol: "Code27Client.build_ws_url"
    started_from: "Code27Coordinator.async_start_realtime"
    stopped_from: "Code27Coordinator.async_stop_realtime"
  frame_handling:
    shape: "{\"type\": \"<topic>\", \"data\": {...}}"
    fragmented_frame_reassembly: "delegated to aiohttp (async iteration yields complete reassembled TEXT messages)"
    binary_frames: "ignored"
    malformed_json: "dropped silently"
    handler_exception: "caught per handler, logged, connection retained"
  reconnect:
    strategy: "exponential backoff, 2s doubling to a 60s cap, retried forever"
    resubscription: "not applicable; the device re-sends a full snapshot per topic on every (re)connect"
    auth_failure_handling: "no re-pair; REST 401 raises ConfigEntryAuthFailed and starts HA reauth instead"
    heartbeat: "aiohttp heartbeat=30"
  reconnect_safe: true
  single_outstanding_receive: "yes (single `async for` consumer)"
  known_limitations:
    - "music_storage has no REST poll fallback, so a permanently lost WebSocket leaves the media browser and the storage sensor empty."
    - "A session-scoped credential would make the handshake fail with 401 and there is no recovery path other than re-pairing."

  topics:
    - topic: music_storage
      semantics: "full TF-card snapshot: is_loaded, root_path, music_files[31], capacity_total_bytes, capacity_used_bytes, updated_at_ms, version; re-sent unprompted roughly every 50s"
      subscribed: true
      handler: "Code27Coordinator._handle_ws_music_storage"
      state_updated: "Code27Data.music_storage"
      fallback_polling: false
      reconnect_safe: true
      tests:
        coverage: PARTIAL
        files: ["tests/test_stage_three.py"]
        cases: ["CoordinatorTests (generic stale/duplicate push rejection via _handle_music_push)"]
      limitations: "resolved: GET /data/user/music/storage (C27-061) is now polled; an inventory-less push is rejected and a poll without an inventory preserves the last valid one"

    - topic: music_page
      semantics: "is_open, updated_at_ms, version; snapshot on connect"
      subscribed: true
      handler: "Code27Coordinator._handle_ws_music_page"
      state_updated: "Code27Data.music_page"
      fallback_polling: true
      reconnect_safe: true
      tests:
        coverage: PARTIAL
        files: ["tests/test_stage_three.py"]
        cases: ["CoordinatorTests.test_stale_and_duplicate_push_rejected", "CoordinatorTests.test_push_during_full_poll_survives_late_http"]
      limitations: null

    - topic: music_playback
      semantics: "status, track_id, track_name, duration_ms, position_ms, is_playing, volume_level, volume_max, error_code, error_message, play_mode, updated_at_ms, version"
      subscribed: true
      handler: "Code27Coordinator._handle_ws_music_playback"
      state_updated: "Code27Data.music_playback"
      fallback_polling: true
      reconnect_safe: true
      tests:
        coverage: PARTIAL
        files: ["tests/test_stage_three.py"]
        cases: ["CoordinatorTests.test_older_http_does_not_replace_preexisting_push"]
      limitations: null

    - topic: music_source
      semantics: "source, origin, request_id, is_applying, error_code, error_message, updated_at_ms, version, music_session_id"
      subscribed: true
      handler: "Code27Coordinator._handle_ws_music_source"
      state_updated: "Code27Data.music_source"
      fallback_polling: true
      reconnect_safe: true
      tests:
        coverage: PARTIAL
        files: ["tests/test_stage_three.py"]
        cases: ["CoordinatorTests.test_push_does_not_reset_poll_or_mark_other_resources_healthy"]
      limitations: null

    - topic: music_audio_route
      semantics: "route, wired_headset, updated_at_ms, version"
      subscribed: true
      handler: "Code27Coordinator._handle_ws_music_audio_route"
      state_updated: "Code27Data.music_audio_route"
      fallback_polling: true
      reconnect_safe: true
      tests:
        coverage: PARTIAL
        files: ["tests/test_stage_three.py"]
        cases: ["CoordinatorTests (generic push handling)"]
      limitations: null

    - topic: bluetooth_state
      semantics: "is_connected, device_name, device_address, paired_device_count, is_bluetooth_enabled, local_device_name, paired_devices[], operation"
      subscribed: true
      handler: "Code27Coordinator._handle_ws_bluetooth_state"
      state_updated: "Code27Data.bluetooth_state"
      fallback_polling: true
      reconnect_safe: true
      tests:
        coverage: PARTIAL
        files: ["tests/test_stage_three.py"]
        cases: ["CoordinatorTests (generic push handling)"]
      limitations: null

    - topic: chat_history
      semantics: "event, version, changed_at_ms, scope - DEAD topic: delivers one empty snapshot on connect and then never fires again"
      subscribed: false
      handler: null
      state_updated: null
      fallback_polling: true
      reconnect_safe: true
      tests:
        coverage: NONE
        files: []
        cases: []
      limitations: "Correctly NOT subscribed. New chat messages are detected by the dedicated 3s REST chat poll (Code27Coordinator._async_poll_chat) instead, which matches the final research conclusion that chat_history must not be used as a chat change source."

# ---------------------------------------------------------------------------
# Locally retrievable resources (only resources proven by research evidence)
# ---------------------------------------------------------------------------
resources:
  - resource: "original-portrait PNG (factory-default characters)"
    discovery_source: "GET /resources/system/original-portraits/manifest -> data.portraits[].portrait_path"
    addressing_rule: "/resources/system/assets/original-portraits/{slot_number}_{cloth_id}.png"
    evidence: "manifest portrait_path is literally \"/v1/api/resources/system/assets/original-portraits/1_1.png\" etc.; 9 files downloaded with HTTP 200 (phase 4 local-data)"
    local: true
    auth_required: true
    hase_status: IMPLEMENTED
    implementation:
      files: ["custom_components/hase/providers/code27/api.py", "custom_components/hase/providers/code27/image.py"]
      symbols: ["Code27Client.get_character_portrait", "Code27PortraitImage.async_image"]
    cache_policy: "none; fetched per image request, and the image platform re-fetches only when that slot's selected_cloth changes"
    tests:
      coverage: STRONG
      files: ["tests/test_bridge_delivery.py"]
      cases: ["ApiTests.test_get_character_portrait_falls_back_to_stock_portrait", "ApiTests.test_get_character_portrait_returns_none_when_nothing_exists"]
    notes: "HASE hardcodes exactly the path pattern the manifest reports. This path is NOT one of the 127 inventory operations (the manifest lists it); it is therefore not a C27 ledger row, only a resource row."

  - resource: "custom cloth thumbnail (rendered VRM portrait)"
    discovery_source: "GET /data/user/cloth/uploaded-models -> data.models[].filename (with slot_number / cloth_id keys)"
    addressing_rule: "/resources/user/assets/thumbnails/{slot_number}_{cloth_id}_{filename-without-extension}.png"
    evidence: "phase 4: relative_path 5/2/Ginny.vrm -> thumbnails/5_2_Ginny.png returned 200 image/png; thumbnails/1_2_Lylia.png returned 200; wrong suffix variants returned 404"
    local: true
    auth_required: true
    hase_status: IMPLEMENTED
    implementation:
      files: ["custom_components/hase/providers/code27/api.py", "custom_components/hase/providers/code27/image.py"]
      symbols: ["Code27Client.get_character_portrait", "Code27Client.get_cloth_uploaded_models", "Code27PortraitImage.async_image"]
    cache_policy: "none; preferred source, falls back to the stock portrait on failure"
    tests:
      coverage: STRONG
      files: ["tests/test_bridge_delivery.py"]
      cases: ["ApiTests.test_get_character_portrait_prefers_custom_thumbnail"]
    notes: "Only the addressing relationship confirmed by research is relied on: thumbnail name = {slot}_{cloth}_{stem} of the uploaded model file. A 404 is treated as 'no custom thumbnail for this slot/cloth'."

  - resource: "uploaded cloth model metadata (VRM relationships)"
    discovery_source: "GET /data/user/cloth/uploaded-models"
    addressing_rule: "JSON only: data.models[] with filename, relative_path, size_bytes, slot_number, cloth_id, state; data.root, data.total"
    evidence: "captured live response (4 models, root=/data/user/0/com.clt01.display/files/assets/characters)"
    local: true
    auth_required: true
    hase_status: PARTIAL
    implementation:
      files: ["custom_components/hase/providers/code27/api.py"]
      symbols: ["Code27Client.get_cloth_uploaded_models"]
    cache_policy: "none; fetched on each portrait resolution"
    tests:
      coverage: PARTIAL
      files: ["tests/test_bridge_delivery.py"]
      cases: ["ApiTests.test_get_character_portrait_prefers_custom_thumbnail"]
    notes: "HASE consumes only slot_number / cloth_id / filename (to build the thumbnail URL). relative_path, size_bytes and state are available but unused. The VRM binary itself is under data.root on the device filesystem and is NOT retrievable over HTTP."

  - resource: "chat image (previously sent/received)"
    discovery_source: "chat history message whose content_type == \"image\"; the message's content field carries the uuid"
    addressing_rule: "/resources/user/chat-images?uuid=<uuid>"
    evidence: "captured live chat history and chat-images behaviour documented in CODE27-LOCAL-API.md"
    local: true
    auth_required: true
    hase_status: NOT_IMPLEMENTED
    implementation: null
    cache_policy: null
    tests:
      coverage: NONE
      files: ["tests/test_bridge_delivery.py"]
      cases: ["ApiTests.test_get_chat_image_calls_binary_endpoint_with_uuid (client method only; no production consumer)"]
    notes: "Code27Client.get_chat_image exists but has no production call site - only a unit test calls it. HASE's own docs/CODE27-FEATURE-STATUS.md records that image display in the card was deliberately deferred. Dead code, not an implementation."

  - resource: "chat audio / chat audio bundle"
    discovery_source: "not used by HASE"
    addressing_rule: "/resources/user/chat-audio and /resources/user/chat-audio-bundle?clip_id= (repeatable)"
    evidence: "inventory.json contains both operations; semantics documented in CODE27-LOCAL-API.md"
    local: true
    auth_required: true
    hase_status: NOT_IMPLEMENTED
    implementation: null
    cache_policy: null
    tests:
      coverage: NONE
      files: []
      cases: []
    notes: "No reference to chat-audio anywhere in the HASE repository."

