    quirks: "TTS has no slot-addressed endpoint, so HASE verifies the active slot before speaking and silently suppresses a stale request rather than speaking through a newly selected character. If the character has no voice_id, HASE logs tts_no_voice and does not call the endpoint at all. group_key is sent as an empty string when the character has none."
    notes: "Semantic completeness is CORRECT: submit + poll to a terminal state. The FAILED and timeout branches of the poll loop are untested (see C27-066)."

