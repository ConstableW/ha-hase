    method: POST
    path: "/data/user/light-projects/preview"
    category: light
    purpose: "Draft preview: render an ad-hoc (non-persisted) light project supplied in the request body. This is the mechanism the device's own Light Editor uses while designing."
    code27:
      evidence: "body shape {project: {...}} CONFIRMED FROM CODE (the research did not execute writes)"
      verification: VERIFIED_FROM_CODE
      capability: "lab.light_editor (enabled on the known device)"
    hase:
      status: IMPLEMENTED
      operation: "Render an ad-hoc solid colour / simple effect on the LED ring (ambient light and notification blink)"
      files: ["custom_components/hase/providers/code27/api.py", "custom_components/hase/providers/code27/light.py", "custom_components/hase/providers/code27/coordinator.py", "custom_components/hase/providers/code27/const.py"]
      symbols: ["Code27Client.preview_light_color", "Code27PreviewLight.async_turn_on", "Code27Coordinator.async_trigger_notification", "Code27Coordinator.async_acknowledge_notification", "LIGHT_EFFECT_TO_TYPE"]
      call_sites: ["light.py async_turn_on", "coordinator.py notification trigger (effect BLINK) and acknowledge (restore previous effect/colour)"]
      exposure: "HA light entity (RGB colour, brightness, effect) + hase.notify service"
    request:
      path_parameters: []
      query_parameters: []
      body: "{project: {projectId, name, version, mode, ledCount, durationMs, segments[{segmentId, startMs, durationMs, layers[{layerId, owner, kind, ledRange{start,endInclusive}, enabled, priority, type, brightness, speed, primaryColor{r,g,b}, secondaryColor{r,g,b}}]}], normal{}, reactive{}, updatedAt}}"
      important_types: "brightness 0-255; RGB ints 0-255; type is the device enum (STATIC|BREATHE|PULSE|BLINK|CHASE); endInclusive is ledCount-1; ledCount is taken from the first polled project or defaults to 17"
      encoding: "JSON body, compact separators. HASE synthesizes the project object itself."
      multipart: false
    response:
      available_fields: "write acknowledgement (no readback exists for preview state)"
      consumed_fields: []
    async_semantics:
      type: fire_and_forget
      states: []
      terminal_states: []
      completion_detection: "none - CODE27 offers no readback for the preview channel. HASE therefore tracks the last requested colour/effect itself on the coordinator and documents that the light's colour/effect attributes describe what HA last asked for, not a device-confirmed state."
    websocket:
      related: false
      topics: []
      fallback_polling: false
    cache:
      policy: "the intended colour/effect/brightness is held on the coordinator (ambient_rgb_color / ambient_brightness / ambient_effect) because there is no device-side readback"
    tests:
      coverage: PARTIAL
      files: ["tests/test_stage_three.py", "tests/test_light_color_parameters.py"]
      cases: ["CoordinatorTests.test_notification_restore_failure_is_retryable", "CoordinatorTests.test_failure_after_preview_stop_retries_master_switch", "CoordinatorTests.test_failed_notify_can_be_cleaned_up"]
