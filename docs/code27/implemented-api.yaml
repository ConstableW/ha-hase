      files: ["custom_components/hase/providers/code27/api.py", "custom_components/hase/providers/code27/bridge.py"]
      symbols: ["Code27Client.get_tts_audition_state", "async_speak_text"]
      call_sites: ["bridge.py async_speak_text: polls every 0.35s inside an asyncio.timeout(15.0) until state ENDED or FAILED"]
      exposure: "Indirect - drives hase.speak and the bridge 'speak the reply' option, and the logbook messages tts_ok / tts_failed / tts_timeout"
    request:
      path_parameters: []
      query_parameters: []
