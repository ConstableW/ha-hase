  - id: C27-074
    method: POST
    path: "/auth/pair/confirm"
    category: auth
    purpose: "Exchange the 6-digit on-screen pairing code plus challenge_id for permanent local credentials."
    code27:
      evidence: "explicitly signature-exempt; CODE27-LOCAL-API.md documents the response incl. local_secret and auth_scope (permanent | session, the latter with local_session_id)"
      verification: VERIFIED_LIVE
      capability: null
    hase:
      status: IMPLEMENTED
      operation: "Complete device pairing and persist credentials"
      files: ["custom_components/hase/providers/code27/api.py", "custom_components/hase/providers/code27/config_flow.py"]
      symbols: ["Code27Client.pair_confirm", "Code27FlowMixin.async_step_pair", "Code27FlowMixin._async_finish_pairing"]
      call_sites: ["config_flow.py: async_step_pair on user input of the pairing code"]
      exposure: "HA config flow (and the reauth flow)"
    request:
      path_parameters: []
      query_parameters: []
      body: "{pairing_code: <string>, challenge_id: <string>}"
      important_types: "pairing_code is a STRING (leading zeros matter); challenge_id is a string from C27-075. HASE does NOT send auth_scope, so the device default applies."
      encoding: "JSON, compact separators; signed=False (one of the three signature-exempt paths)"
      multipart: false
    response:
      available_fields: "local_secret, auth_scope ('permanent' | 'session'), and for session scope also local_session_id"
      consumed_fields: ["local_secret"]
    async_semantics:
      type: none
      states: []
      terminal_states: []
      completion_detection: null
    websocket:
      related: true
      topics: []
      fallback_polling: false
    cache:
      policy: "the returned user_id + local_secret are persisted in the HA config entry"
    tests:
      coverage: STRONG
      files: ["tests/test_stage_three.py"]
      cases: ["FlowTests.test_matching_device_reauth_persists_reloads_aborts_without_creating", "FlowTests.test_wrong_device_reauth_does_not_change_existing_entry", "FlowTests.test_identity_read_retry_does_not_pair_twice"]
    quirks: "HASE ignores auth_scope and local_session_id entirely. There is no session_id handling anywhere in the repository, so a session-scoped credential would 401 on every signed request and on the WebSocket handshake with no recovery other than re-pairing. Because HASE does not request session scope it should receive a permanent credential, but this is not live-verified."
    notes: "On PAIRING_CODE_EXPIRED / PAIRING_CODE_USED the flow requests a fresh code instead of failing, which is correct handling of a burned code."

