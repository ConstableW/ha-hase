      important_types: "state is a STRING; the validator enforces string type for the `state` key"
      encoding: null
      multipart: false
    response:
      available_fields: "state (STARTING | WAITING | PLAYING | IDLE | ENDED | FAILED)"
      consumed_fields: ["state"]
    async_semantics:
      type: polling
      states: ["STARTING", "WAITING", "PLAYING", "IDLE", "ENDED", "FAILED"]
      terminal_states: ["ENDED", "FAILED"]
      completion_detection: "state compared case-insensitively after .upper(); ENDED -> success, FAILED -> failure; any other state keeps polling until the 15s wall-clock deadline"
    websocket:
      related: false
      topics: []
      fallback_polling: true
    cache:
      policy: "none"
    tests:
      coverage: PARTIAL
